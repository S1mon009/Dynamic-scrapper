<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sample Gallery Page</title>
  </head>
  <body>
    <header>
      <h1>Anime Wallpaper Gallery</h1>
      <h2 class="subtitle">Curated collection</h2>
    </header>

    <main id="gallery">
      <a href="/gallery/1" class="card">
        <img src="/images/bleach-001.jpg" alt="Bleach wallpaper" class="thumb lazy" data-id="101" />
      </a>
      <a href="/gallery/2" class="card">
        <img
          src="https://cdn.example.com/images/naruto-002.png"
          alt="Naruto wallpaper"
          class="thumb"
          data-id="102"
        />
      </a>
      <a href="/gallery/3" class="card external">
        <img src="/images/onepiece-003.gif" alt="One Piece banner" class="hero" data-id="103" />
      </a>
      <a href="https://external.example.org/promo">External sponsor link</a>
      <a href="mailto:contact@example.com">Contact us</a>

      <p class="description">Hand-picked wallpapers updated weekly.</p>

      <table id="stats">
        <thead>
          <tr>
            <th>Series</th>
            <th>Views</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Bleach</td>
            <td>1200</td>
          </tr>
          <tr>
            <td>Naruto</td>
            <td>980</td>
          </tr>
        </tbody>
      </table>

      <a href="/document.pdf" download>Download PDF guide</a>
    </main>
  </body>
</html>
